listen = "0.0.0.0:8080"
target = "https://integrate.api.nvidia.com"
[[keys]]
key = "${NIMAPROXY_KEY_DOLTARES}"
label = "doltares"

# 2026-09-02: "ares" key parked - GET /v1/models works but every POST inference
# returns 403 "Authorization failed". Rotate/re-entitle the key, then restore.
# 2026-10-15 re-probe: ares still 403 on stepfun-ai/step-5-preview inference
# (doltares/backup/extra all 200). Parked so rotation skips it rather than
# serving it a request that cannot succeed.
[[keys]]
key = "${NIMAPROXY_KEY_ARES}"
label = "ares"
disabled = true

[[keys]]
key = "${NIMAPROXY_KEY_BACKUP}"
label = "backup"

[[keys]]
key = "${NIMAPROXY_KEY_EXTRA}"
label = "extra"

# 2026-10-15: probed alongside the four above; returns 200 on
# stepfun-ai/step-5-preview. Not present in the original 2026-09-02 pool.
[[keys]]
key = "${NIMAPROXY_KEY_OPERATOR_BRUSH}"
label = "operator-brush"

[racing]
# Tuned from live nimaproxy traces on 2026-06-14.
# Refreshed 2026-09-02 against the authenticated /v1/models catalog: dropped z-ai/glm-5.1,
# stepfun-ai/step-3.7-flash, qwen/qwen3.5-397b-a17b, minimaxai/minimax-m2.7,
# deepseek-ai/deepseek-v4-flash (absent upstream); added openai/gpt-oss-120b,
# openai/gpt-oss-20b, nvidia/nemotron-3-super-120b-a12b (each proven via live non-streaming
# max_tokens=8 + streaming chat completions, 0.8s-3.5s). deepseek-ai/deepseek-v4-flash-0731,
# deepseek-ai/deepseek-v4-pro-0813, and moonshotai/kimi-k3 were probed but timed out
# (60-90s across 3 keys) and were not adopted. moonshotai/kimi-k2.6 dropped: still listed
# upstream but 404 ("Function not found for account") on inference for every working key.
enabled = true
# 2026-10-15: step-5 only. The multi-model pool (nemotron/gpt-oss/minimax) was
# last validated 2026-09-02 and served no stepfun entry; step-5 was never in it.
models = [
"stepfun-ai/step-5-preview",
]
max_parallel = 2
# 2026-10-19: 15000 -> 25000. This key is NOT a racing-path timeout: it is read as
# `max_timeout_ms` by timeouts.rs -> get_model_timeout_with_policy() and applies to
# every model request, so it is the CEILING of the dynamic timeout AND the value
# returned outright when the sample ring is below `dynamic_sample_floor`.
#
# The deployed pair was ceiling=15000 with floor=15000, so every branch of
# dynamic_timeout_ms_with_policy() returned exactly 15000 and the "dynamic" timeout
# was a hidden constant. That is the whole defect: it was not mis-tuned, it was pinned.
#   remaining_samples < floor -> return max_timeout_ms                  = 15000
#   normal path               -> min(p95+buffer, max).max(min)          = 15000
#
# Derived from the live ttfb distribution, not chosen: successes on the post-deploy
# binary put 4.34% of first-byte times in [13,15)s, so the cutoff sat INSIDE the
# distribution and censored its own tail. Exponential fit on ttfb>=9s (mean 12.1s,
# lambda 0.0826/s) predicts the stall rate falls 10.65% -> 4.66%, recovering ~97 of the
# 173 live 504s -- all of which are this class.
#
# Deliberately equal to min_dynamic_timeout_ms so that BOTH branches yield 25000. A
# ceiling above the floor would make the low-sample branch return the ceiling instead,
# undoing this change on a cold ring; raising the ceiling above 25000 is the lever to
# restore upward adaptation, and is a separate, separately-measured decision.
timeout_ms = 25000
max_total_request_ms = 25000
strategy = "complete"
adaptive = true
min_parallel = 2
pressure_parallel = 2
degraded_parallel = 2
solo_fallback = true
large_prompt_char_threshold = 12000
large_prompt_parallel = 1
model_check_interval_secs = 3600
fast_models = [
"stepfun-ai/step-5-preview",
]
fallback_models = [
"stepfun-ai/step-5-preview",
]

[limits]
# 2026-10-19: sized from Little's law against live traffic, then deliberately held BELOW
# the derived peak. Measured on loop-depth-v4: mean slot-hold 20.8s (p50 9.4s, p95 101s,
# max 117.9s), mean arrival 0.036/s, peak minute 0.883/s.
#   mean concurrency needed  = 0.75   <- why the old cap looked fine on averages
#   peak concurrency needed  = 18.4 at the mean hold, 89 at the p95 hold
#
# A cap of 8 is sized for neither, which is what overload_rejects = 150/1681 measures.
#
# The derived peak is NOT the right target, though, because the two failure modes
# compete: overload_rejects is this proxy shedding load, rate_limit_count is the upstream
# shedding it. Raising the window converts the first into the second rather than removing
# either. That trade is already visible at the old cap -- rate_limit_count rose 4 -> 14
# as traffic resumed, while max_in_flight_per_key was still 2.
#
# So this takes one conservative step: double the per-key allowance (2 -> 4, i.e. 16
# total) to absorb short bursts, and treat the p95-hold case as load to shed. That case
# cannot be covered at any setting (89 slots), so a larger cap would only deepen the
# upstream's 429s. If rate_limit_count climbs, max_in_flight_per_key is the knob to pull
# back first, because per-key concurrency is the dimension the upstream throttles on.
max_upstream_in_flight = 16
max_in_flight_per_key = 4
# 5000ms is shorter than a single mean slot-hold (20.8s), so a queued request almost
# never sees a slot free before it is rejected -- the reject is decided by arithmetic,
# not by load. Waiting at least one mean hold lets queueing absorb a burst. This is the
# part of the change with no countervailing cost: it converts hard rejects into waits
# and raises upstream concurrency not at all.
admission_wait_ms = 30000

[timeouts]
# 2026-10-19: 15000 -> 25000 to match timeout_ms. A floor below the configured cutoff
# would re-clip the tail that raising timeout_ms just uncovered, so the two must move
# together or the dynamic path silently undoes the change.
min_dynamic_timeout_ms = 25000
dynamic_sample_floor = 25
# 2026-10-19: the mid-stream idle rail, split from the first-byte window
# above. The first byte answers "is the upstream alive" (25 s); a gap
# between chunks answers "did a live generation stall". A/B measured
# step-5-preview pausing 118 s / 148 s mid-generation then resuming to
# [DONE] -- the 60 s value cut generations the upstream would have finished.
# 180 s covers the measured max + headroom. Same as the code default.
mid_stream_idle_timeout_ms = 180000

[routing]
strategy = "latency_aware"
spike_threshold_ms = 12000
models = [
"stepfun-ai/step-5-preview",
]


# 2026-10-21: the 13 unreachable models' model_params blocks were removed. They
# were dead config: `[routing].models`, `[racing].models`, `fast_models` and
# `fallback_models` all listed only step-5-preview, and a request naming any
# other model is refused by validate_model_exists with HTTP 400 "model not
# found in configured models" (measured live). Their max_tokens ceilings
# therefore governed nothing, and the 16384 cap that issue #38 tracked as a
# residual exposure was never reachable. Re-enabling a model means adding its
# block back, deliberately.
[model_params."stepfun-ai/step-5-preview"]
# 2026-10-21 (model-card audit): builder settings temperature=1.0/top_p=0.95/
# top_k=0 per build.nvidia.com/stepfun-ai/step-5-preview. top_k=0 validated
# live: A/B x3 at 1024 budget, 6/6 stop/Hello, no behavioral delta vs omitted
# (an empty length row at max_tokens=64 was reasoning overhead exhausting a
# tiny budget, not a top_k defect; irrelevant at production budgets).
# reasoning_effort=high validated live on NVIDIA (not just StepFun-native):
# +10 prompt tokens, 88s vs 29s on identical plan prompt, deeper output.
# max_tokens 16384 -> 32768: 26 measured finish_reason=length truncations, all
# at exactly 16384, all tool-heavy (16-38 calls). Native max output is 64k.
temperature = 1.0
top_p = 0.95
top_k = 0
max_tokens = 32768
stream = true
reasoning_effort = "high"

[model_compat]
# NVIDIA NIM does NOT support 'developer' role - transform all models (default behavior)
# Models that support tool messages (don't need transformation)
# Special value "all" means all models support tool messages - no transformation needed
supports_tool_messages = ["all"]

[circuit_breaker]
# 2026-10-21: 32000 -> 36000, moved WITH max_tokens 16384 -> 32768. The breaker
# assigns (not accumulates) per-completion output tokens and degrades when the
# count exceeds this value, so a legal full-length 32768 completion must not
# self-degrade the model. 36000 = cap + headroom for the estimator's
# bytes/4 fallback on bodies without usage. Chat path never writes these
# counters (only legacy /v1/completions), but the bound must still be sane.
max_output_tokens = 36000
max_repetitions = 5
max_consecutive_assistant_turns = 10

# Turn logging for observability
[logging]
enabled = true
path = "/var/log/nimaproxy/turns.jsonl"
