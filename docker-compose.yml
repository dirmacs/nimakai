# Declarative record of the live nimaproxy deployment.
#
# The live container was created by a hand-run `docker run` that later had to
# be reconstructed from `docker inspect`. This file captures that measured spec
# so the next deploy is reproducible:
#   image:         dirmacs/nimaproxy:loop-depth-v4
#   container:     ${NIMAPROXY_CONTAINER:-nimaproxy}
#   port:          127.0.0.1:8080 -> 8080/tcp (loopback only, NOT 0.0.0.0)
#   config mount:  ${NIMAPROXY_CONFIG_PATH:?set NIMAPROXY_CONFIG_PATH to the host path of nimaproxy.toml} -> /etc/nimaproxy.toml (ro;
#                  holds a real API key -- never bake it into an image)
#   log mount:     /var/log/nimaproxy -> /var/log/nimaproxy (rw; usage data)
#
# Deploys go through scripts/deploy.sh, which verifies the candidate on a free
# port over host networking BEFORE cutover. After a successful deploy, bump the
# image tag below to the new running tag so this file stays the spec.
#
# NOTE: the binary binds localhost inside the container, so Docker port
# publishing cannot reach a `docker run -p` candidate; verification MUST use
# host networking (see scripts/deploy.sh).

services:
  nimaproxy:
    image: dirmacs/nimaproxy:loop-depth-v4
    container_name: ${NIMAPROXY_CONTAINER:-nimaproxy}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ${NIMAPROXY_CONFIG_PATH:?set NIMAPROXY_CONFIG_PATH to the host path of nimaproxy.toml}:/etc/nimaproxy.toml:ro
      - /var/log/nimaproxy:/var/log/nimaproxy:rw
    environment:
      NIMAPROXY_PID_FILE: /run/nimaproxy/nimaproxy.pid
    restart: unless-stopped
    entrypoint: ["nimaproxy"]
    command: ["--config", "/etc/nimaproxy.toml"]
