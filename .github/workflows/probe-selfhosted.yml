name: probe-selfhosted
on: [workflow_dispatch]
jobs:
  probe:
    runs-on: [self-hosted, linux, arm64, dirmacs-ci]
    steps:
      - name: Toolchain availability
        run: |
          echo "runner arch: $(uname -m)"
          for tool in cargo rustc python3 bash sed; do
            if command -v "$tool" >/dev/null 2>&1; then
              echo "$tool: OK -> $("$tool" --version 2>&1 | head -1)"
            else
              echo "$tool: MISSING"
            fi
          done
      - name: Filesystem space
        run: df -h /tmp /opt 2>/dev/null | head -5
      - name: Can cargo build this crate on this runner
        env:
          RUSTUP_TOOLCHAIN: '1.99.0'
        run: |
          cargo --version || exit 1
          cargo check --locked --manifest-path nimaproxy/Cargo.toml
